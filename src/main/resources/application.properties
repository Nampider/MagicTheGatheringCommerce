spring.application.name=commerce
server.port=${SERVER_PORT:8080}

spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5433/commerce_db}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:postgres}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:postgres}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:5433/commerce_db}
spring.flyway.user=${SPRING_FLYWAY_USER:${SPRING_R2DBC_USERNAME:postgres}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${SPRING_R2DBC_PASSWORD:postgres}}
spring.flyway.locations=${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URL:http://localhost:8081/realms/cards}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/cards/protocol/openid-connect/certs}
spring.docker.compose.enabled=false

commerce.payment-provider=${COMMERCE_PAYMENT_PROVIDER:mock}
commerce.currency=${COMMERCE_CURRENCY:usd}
commerce.accounts-service-url=${ACCOUNTS_SERVICE_URL:http://localhost:8082}
commerce.website-url=${MAGIC_WEBSITE_URL:http://localhost:8083}

stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}

app.frontend.success-url=${APP_SUCCESS_URL:http://localhost:5173/payment/success?session_id={CHECKOUT_SESSION_ID}}
app.frontend.cancel-url=${APP_CANCEL_URL:http://localhost:5173/payment/cancel}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

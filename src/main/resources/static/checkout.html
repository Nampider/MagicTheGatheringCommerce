<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Stripe Checkout Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 520px; }
        label { display: block; margin-top: 16px; }
        input { box-sizing: border-box; display: block; margin-top: 6px; padding: 10px; width: 100%; }
        button { margin-top: 20px; padding: 10px 18px; }
        #payment-result { font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
<h2>Stripe Checkout Test</h2>

<form id="payment-form">
    <label>
        Product
        <input id="productName" value="Magic: The Gathering booster pack">
    </label>

    <label>
        Amount cents
        <input id="amountCents" type="number" value="1099">
    </label>

    <label>
        Currency
        <input id="currency" value="usd">
    </label>

    <button id="submit" type="submit">Create Checkout Session</button>
</form>

<div id="payment-result"></div>

<script>
    const form = document.getElementById("payment-form");
    const result = document.getElementById("payment-result");

    form.addEventListener("submit", async (event) => {
        event.preventDefault();
        result.textContent = "Creating checkout session...";

        const token = localStorage.getItem("access_token");
        const headers = {
            "Content-Type": "application/json",
            "Idempotency-Key": crypto.randomUUID()
        };

        if (token) {
            headers.Authorization = `Bearer ${token}`;
        }

        const response = await fetch("/api/payment/checkout", {
            method: "POST",
            headers,
            body: JSON.stringify({
                productName: document.getElementById("productName").value,
                amountCents: Number(document.getElementById("amountCents").value),
                currency: document.getElementById("currency").value
            })
        });

        if (!response.ok) {
            result.textContent = `Checkout failed: ${response.status}`;
            return;
        }

        const checkout = await response.json();
        window.location.href = checkout.checkoutUrl;
    });
</script>
</body>
</html>
